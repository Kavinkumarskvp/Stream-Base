worker_processes auto;

events {
    worker_connections 1024;
}

http {

    include mime.types;
    limit_req_zone $binary_remote_addr zone=api_limit:10m
    rate=10r/s;


    map $http_upgrade $connection_upgrade {
        default     upgrade;
        ''          close;
    }

   log_format main '$remote_addr - $upstream_addr [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    'rt=$request_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 1024;

    upstream streambase {
        least_conn;
        keepalive 32;
        server app-1:8080 max_fails=3 fail_timeout=30s;
        server app-2:8080 max_fails=3 fail_timeout=30s;
        server app-3:8080 max_fails=3 fail_timeout=30s;
    }

    server {

        add_header X-Frame-Options      DENY;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection     '1; mode=block';

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header   Connection "";

        server_name streambase;
        listen 80;
        location / {
            proxy_pass http://streambase;
        }

        location /ws/ {
            proxy_pass                          http://streambase;
            proxy_http_version                  1.1;
            proxy_set_header Upgrade            $http_upgrade;
            proxy_set_header Connection         $connection_upgrade;
            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_read_timeout                  3600s;
            proxy_send_timeout                  3600s;
        }
    }
}
