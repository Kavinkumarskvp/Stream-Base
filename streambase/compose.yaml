services:
  postgres-primary:
    image: postgres:18.3-alpine
    environment:
      - POSTGRES_DB=mydatabase
      - POSTGRES_PASSWORD=secret
      - POSTGRES_USER=myuser
    command: |
      postgres
      -c wal_level=replica
      -c max_wal_senders=3
      -c wal_keep_size=64
      -c hba_file=/etc/postgresql/pg_hba.conf
    volumes:
      - postgres-primary-data:/var/lib/postgresql
      - ./docker/postgres-primary/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./docker/postgres-primary/pg_hba.conf:/etc/postgresql/pg_hba.conf
    ports:
      - "5432:5432"

  postgres-replica:
    image: postgres:18.3-alpine
    environment:
      - PGDATA=/var/lib/postgresql/data
    entrypoint: [ "/bin/bash", "/init.sh" ]
    volumes:
      - postgres-replica-data:/var/lib/postgresql
      - ./docker/postgres-replica/init.sh:/init.sh
    depends_on:
      - postgres-primary
    ports:
      - "5433:5432"

  redis:
    image: redis:8.6.2-alpine
    ports:
      - "6379:6379"

  app-1:
    build: .
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DB_URL=jdbc:postgresql://postgres-primary:5432/mydatabase
      - DB_REPLICA_URL=jdbc:postgresql://postgres-replica:5432/mydatabase
      - DB_USERNAME=myuser
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JAVA_TOOL_OPTIONS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
    ports:
      - "5005:5005"
    depends_on:
      - postgres-primary
      - postgres-replica
      - redis

  app-2:
    build: .
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DB_URL=jdbc:postgresql://postgres-primary:5432/mydatabase
      - DB_REPLICA_URL=jdbc:postgresql://postgres-replica:5432/mydatabase
      - DB_USERNAME=myuser
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - postgres-primary
      - postgres-replica
      - redis

  app-3:
    build: .
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DB_URL=jdbc:postgresql://postgres-primary:5432/mydatabase
      - DB_REPLICA_URL=jdbc:postgresql://postgres-replica:5432/mydatabase
      - DB_USERNAME=myuser
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - postgres-primary
      - postgres-replica
      - redis

  nginx:
    image: nginx:1.29.8-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - app-1
      - app-2
      - app-3

volumes:
  postgres-primary-data:
  postgres-replica-data: