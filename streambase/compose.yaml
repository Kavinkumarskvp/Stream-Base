services:
  postgres-primary:
    image: postgres:18.3-alpine
    environment:
      - POSTGRES_DB=mydatabase
      - POSTGRES_PASSWORD=secret
      - POSTGRES_USER=myuser
    command: |
      postgres
      -c wal_level=replica
      -c max_wal_senders=3
      -c wal_keep_size=64
      -c hba_file=/etc/postgresql/pg_hba.conf
    volumes:
      - postgres-primary-data:/var/lib/postgresql
      - ./docker/postgres-primary/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./docker/postgres-primary/pg_hba.conf:/etc/postgresql/pg_hba.conf
    ports:
      - "5432:5432"

  postgres-replica:
    image: postgres:18.3-alpine
    environment:
      - PGDATA=/var/lib/postgresql/data
    entrypoint: [ "/bin/bash", "/init.sh" ]
    volumes:
      - postgres-replica-data:/var/lib/postgresql
      - ./docker/postgres-replica/init.sh:/init.sh
    depends_on:
      - postgres-primary
    ports:
      - "5433:5432"

  shard-1:
    image: postgres:18.3-alpine
    environment:
      - POSTGRES_DB=shard
      - POSTGRES_PASSWORD=secret
      - POSTGRES_USER=myuser
    ports:
      - "5434:5432"
    volumes:
      - shard-1-data:/var/lib/postgresql

  shard-2:
    image: postgres:18.3-alpine
    environment:
      - POSTGRES_DB=shard
      - POSTGRES_PASSWORD=secret
      - POSTGRES_USER=myuser
    ports:
      - "5435:5432"
    volumes:
      - shard-2-data:/var/lib/postgresql

  shard-3:
    image: postgres:18.3-alpine
    environment:
      - POSTGRES_DB=shard
      - POSTGRES_PASSWORD=secret
      - POSTGRES_USER=myuser
    ports:
      - "5436:5432"
    volumes:
      - shard-3-data:/var/lib/postgresql

  redis:
    image: redis:8.6.2-alpine
    ports:
      - "6379:6379"

  kafka:
    image: apache/kafka:4.3.0
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
    ports:
      - "9092:9092"

  app-1:
    build: .
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DB_URL=jdbc:postgresql://postgres-primary:5432/mydatabase
      - DB_REPLICA_URL=jdbc:postgresql://postgres-replica:5432/mydatabase
      - SHARD_1_URL=jdbc:postgresql://shard-1:5432/shard
      - SHARD_2_URL=jdbc:postgresql://shard-2:5432/shard
      - SHARD_3_URL=jdbc:postgresql://shard-3:5432/shard
      - SHARD_DB_USER=myuser
      - SHARD_DB_PASSWORD=secret
      - DB_USERNAME=myuser
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - JAVA_TOOL_OPTIONS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
    ports:
      - "5005:5005"
    depends_on:
      - postgres-primary
      - postgres-replica
      - shard-1
      - shard-2
      - shard-3
      - redis
      - kafka

  app-2:
    build: .
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DB_URL=jdbc:postgresql://postgres-primary:5432/mydatabase
      - DB_REPLICA_URL=jdbc:postgresql://postgres-replica:5432/mydatabase
      - SHARD_1_URL=jdbc:postgresql://shard-1:5432/shard
      - SHARD_2_URL=jdbc:postgresql://shard-2:5432/shard
      - SHARD_3_URL=jdbc:postgresql://shard-3:5432/shard
      - SHARD_DB_USER=myuser
      - SHARD_DB_PASSWORD=secret
      - DB_USERNAME=myuser
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      - postgres-primary
      - postgres-replica
      - shard-1
      - shard-2
      - shard-3
      - redis
      - kafka

  app-3:
    build: .
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DB_URL=jdbc:postgresql://postgres-primary:5432/mydatabase
      - DB_REPLICA_URL=jdbc:postgresql://postgres-replica:5432/mydatabase
      - SHARD_1_URL=jdbc:postgresql://shard-1:5432/shard
      - SHARD_2_URL=jdbc:postgresql://shard-2:5432/shard
      - SHARD_3_URL=jdbc:postgresql://shard-3:5432/shard
      - SHARD_DB_USER=myuser
      - SHARD_DB_PASSWORD=secret
      - DB_USERNAME=myuser
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      - postgres-primary
      - postgres-replica
      - shard-1
      - shard-2
      - shard-3
      - redis
      - kafka

  nginx:
    image: nginx:1.29.8-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - app-1
      - app-2
      - app-3

volumes:
  postgres-primary-data:
  postgres-replica-data:
  shard-1-data:
  shard-2-data:
  shard-3-data: