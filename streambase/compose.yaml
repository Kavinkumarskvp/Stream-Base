services:
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=mydatabase'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    ports:
      - '5432:5432'

  app-1:
    build: .
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/mydatabase
      - DB_USERNAME=myuser
      - DB_PASSWORD=secret
    depends_on:
      - postgres

  app-2:
    build: .
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/mydatabase
      - DB_USERNAME=myuser
      - DB_PASSWORD=secret
    depends_on:
      - postgres

  app-3:
    build: .
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/mydatabase
      - DB_USERNAME=myuser
      - DB_PASSWORD=secret
    depends_on:
      - postgres

  nginx:
    image: nginx:latest
    ports:
      - '80:80'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - app-1
      - app-2
      - app-3