spring:
  datasource:
    primary:
      url: ${DB_URL}
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}
    replica:
      url: ${DB_REPLICA_URL}
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      timeout: 500ms
      connect-timeout: 500ms
      lettuce:
        shutdown-timeout: 100ms
  elasticsearch:
    uris: ${ELASTICSEARCH_URI}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}